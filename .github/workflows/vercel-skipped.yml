# Vercel GitHub App posts "Account is blocked" on every push even though
# production deploys via Cloudflare Workers (see vercel.json). Re-report the
# required Vercel context as success after the bot finishes.
name: Vercel skipped

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  report-skipped:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for Vercel bot status
        run: sleep 60

      - name: Mark Vercel context skipped
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'Vercel',
              description: 'Skipped — production deploys via Cloudflare Workers',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/blob/main/vercel.json`,
            });
