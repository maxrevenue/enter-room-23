# Vercel GitHub App posts "Account is blocked" on every push even though
# production deploys via Cloudflare Workers (see vercel.json). Re-report the
# required Vercel context as success after the bot finishes.
name: Vercel skipped

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  report-skipped:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for Vercel bot status
        run: sleep 45

      - name: Mark Vercel context skipped
        uses: actions/github-script@v7
        with:
          script: |
            const sha =
              context.eventName === 'pull_request'
                ? context.payload.pull_request.head.sha
                : context.sha;

            const reportSkipped = async () => {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                state: 'success',
                context: 'Vercel',
                description: 'Skipped — production deploys via Cloudflare Workers',
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/blob/main/vercel.json`,
              });
            };

            // Vercel bot may post failure after our first status; report twice.
            await reportSkipped();
            await new Promise((resolve) => setTimeout(resolve, 45000));
            await reportSkipped();
